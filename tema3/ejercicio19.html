<!DOCTYPE html>
<html>
<head>
    <title>DOM Ex9 - setTimeout & clearTimeout</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; text-align: center; max-width: 500px; margin: auto; }
        #countdown {
            font-size: 5rem; font-weight: bold; color: #4a90e2;
            margin: 30px auto; width: 120px; height: 120px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 6px solid #4a90e2;
        }
        .buttons { display: flex; gap: 14px; justify-content: center; margin-top: 20px; }
        button { padding: 12px 28px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; color: white; }
        #startBtn { background: #27ae60; }
        #stopBtn  { background: #e24a4a; }
        #resetBtn { background: #888; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 1rem; color: #555; font-style: italic; }
    </style>
</head>
<body>
    <h1>DOM Exercise 9 — setTimeout + clearTimeout</h1>
    <p>Starts a 5-second countdown. You can stop it before it fires!</p>

    <div id="countdown">5</div>

    <div class="buttons">
        <button id="startBtn" onclick="startTimer()">▶ Start</button>
        <button id="stopBtn" onclick="stopTimer()" disabled>⏹ Stop</button>
        <button id="resetBtn" onclick="resetTimer()" disabled>↺ Reset</button>
    </div>

    <p id="status">Press Start to begin the countdown.</p>

    <script>
        var timer = null;
        var interval = null;
        var secs = 5;

        function startTimer() {
            secs = 5;
            document.getElementById('countdown').textContent = secs;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('status').textContent = "Counting down...";

            interval = setInterval(function() {
                secs--;
                document.getElementById('countdown').textContent = secs;
                if (secs <= 0) clearInterval(interval);
            }, 1000);

            timer = setTimeout(function() {
                alert(" Time's up! The setTimeout fired successfully.");
                document.getElementById('status').textContent = "Alert shown! Timer completed.";
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('resetBtn').disabled = false;
            }, 5000);
        }

        function stopTimer() {
            clearTimeout(timer);
            clearInterval(interval);
            document.getElementById('status').textContent = " Timer stopped before it fired!";
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
        }

        function resetTimer() {
            clearTimeout(timer);
            clearInterval(interval);
            secs = 5;
            document.getElementById('countdown').textContent = secs;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('status').textContent = "Press Start to begin the countdown.";
        }
    </script>
</body>
</html>
