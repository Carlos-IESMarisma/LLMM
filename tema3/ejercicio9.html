<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9 - Temperature Converter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; max-width: 500px; }
        h2 { color: #333; }
        .converter { background: #f0f4ff; border-radius: 10px; padding: 24px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
        label { width: 100px; font-weight: bold; color: #555; }
        input[type="text"] {
            padding: 10px; font-size: 1.1rem; width: 180px;
            border: 2px solid #a0b4f0; border-radius: 6px; outline: none;
        }
        input:focus { border-color: #4a90e2; }
        .unit { font-size: 1.2rem; color: #666; }
        .buttons { display: flex; gap: 12px; margin-top: 20px; }
        button {
            padding: 10px 24px; font-size: 1rem; cursor: pointer;
            border: none; border-radius: 6px; color: white;
        }
        #btnFtoC { background: #4a90e2; }
        #btnCtoF { background: #e24a4a; }
        #btnClear { background: #888; }
        button:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <h2> Temperature Converter</h2>
    <div class="converter">
        <div class="row">
            <label>Fahrenheit:</label>
            <input type="text" id="tbf" placeholder="Enter °F">
            <span class="unit">°F</span>
        </div>
        <div class="row">
            <label>Celsius:</label>
            <input type="text" id="tbc" placeholder="Enter °C">
            <span class="unit">°C</span>
        </div>
        <div class="buttons">
            <button id="btnFtoC" onclick="convertFtoC()">°F → °C</button>
            <button id="btnCtoF" onclick="convertCtoF()">°C → °F</button>
            <button id="btnClear" onclick="clearFields()">Clear</button>
        </div>
    </div>

    <script>
        function toCelsius(f) {
            return (5 / 9) * (f - 32);
        }

        function toFahrenheit(c) {
            return (c * 9 / 5) + 32;
        }

        function convertFtoC() {
            var f = parseFloat(document.getElementById("tbf").value);
            if (isNaN(f)) { alert("Please enter a valid Fahrenheit value."); return; }
            var c = toCelsius(f);
            document.getElementById("tbc").value = c.toFixed(2);
        }

        function convertCtoF() {
            var c = parseFloat(document.getElementById("tbc").value);
            if (isNaN(c)) { alert("Please enter a valid Celsius value."); return; }
            var f = toFahrenheit(c);
            document.getElementById("tbf").value = f.toFixed(2);
        }

        function clearFields() {
            document.getElementById("tbf").value = '';
            document.getElementById("tbc").value = '';
        }
    </script>
</body>
</html>
