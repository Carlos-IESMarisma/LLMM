<!DOCTYPE html>
<html>
<head>
    <title>Exercise 3 - Image Gallery</title>
    <link id="stylesheet" rel="stylesheet" href="style3a.css">
    <style id="inline-style">
        body { font-family: Arial, sans-serif; padding: 20px; }
        .gallery { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .section { flex: 1; min-width: 300px; border: 2px solid #ccc; padding: 15px; border-radius: 8px; }
        img { max-width: 100%; height: 250px; object-fit: cover; border-radius: 4px; display: block; margin: 10px auto; }
        select { padding: 8px; font-size: 16px; margin: 10px 0; border-radius: 4px; }
        .style-buttons { margin-bottom: 20px; }
        button { padding: 8px 16px; margin: 4px; cursor: pointer; border-radius: 4px; border: 1px solid #999; }
    </style>
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="style-buttons">
        <strong>Choose style: </strong>
        <button onclick="setStyle('light')">☀️ Light Style</button>
        <button onclick="setStyle('dark')">🌙 Dark Style</button>
    </div>

    <div class="gallery">
        <!-- CARS SECTION -->
        <div class="section">
            <h2> Cars</h2>
            <img id="carImage" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/2019_Honda_Civic_sedan_%28facelift%2C_black%29%2C_front_8.15.19.jpg/1280px-2019_Honda_Civic_sedan_%28facelift%2C_black%29%2C_front_8.15.19.jpg" alt="Car">
            <select onchange="changeCarImage(this.value)">
                <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/2019_Honda_Civic_sedan_%28facelift%2C_black%29%2C_front_8.15.19.jpg/1280px-2019_Honda_Civic_sedan_%28facelift%2C_black%29%2C_front_8.15.19.jpg">Car 1 - Honda Civic</option>
                <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/BMW_M4_Competition_%28F82%29_IMG_5109.jpg/1280px-BMW_M4_Competition_%28F82%29_IMG_5109.jpg">Car 2 - BMW M4</option>
                <option value="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/2019_Porsche_911_Carrera_4S_%28992%29_Coupe_in_GT_Silver_Metallic%2C_front_8.15.19.jpg/1280px-2019_Porsche_911_Carrera_4S_%28992%29_Coupe_in_GT_Silver_Metallic%2C_front_8.15.19.jpg">Car 3 - Porsche 911</option>
            </select>
        </div>

        <!-- SPIDERMAN SECTION -->
        <div class="section">
            <h2> Spiderman</h2>
            <img id="spiderImage" src="https://upload.wikimedia.org/wikipedia/en/thumb/2/21/Web_of_Spider-Man_Vol_1_129-1.png/220px-Web_of_Spider-Man_Vol_1_129-1.png" alt="Spiderman">
            <select onchange="changeSpiderImage(this.value)">
                <option value="https://upload.wikimedia.org/wikipedia/en/thumb/2/21/Web_of_Spider-Man_Vol_1_129-1.png/220px-Web_of_Spider-Man_Vol_1_129-1.png">Spiderman 1</option>
                <option value="https://upload.wikimedia.org/wikipedia/en/thumb/e/e2/Spider-Man_Unlimited_Vol_1_1.png/220px-Spider-Man_Unlimited_Vol_1_1.png">Spiderman 2</option>
                <option value="https://upload.wikimedia.org/wikipedia/en/thumb/b/b4/Spider-Man_%28Marvel_Comics_character%29.png/220px-Spider-Man_%28Marvel_Comics_character%29.png">Spiderman 3</option>
            </select>
        </div>
    </div>

    <script>
        function changeCarImage(src) {
            document.getElementById('carImage').src = src;
        }

        function changeSpiderImage(src) {
            document.getElementById('spiderImage').src = src;
        }

        function setStyle(theme) {
            const body = document.body;
            const sections = document.querySelectorAll('.section');
            const buttons = document.querySelectorAll('button');
            if (theme === 'dark') {
                body.style.backgroundColor = '#1a1a2e';
                body.style.color = '#eee';
                sections.forEach(s => { s.style.borderColor = '#555'; s.style.backgroundColor = '#16213e'; });
                buttons.forEach(b => { b.style.backgroundColor = '#0f3460'; b.style.color = '#eee'; b.style.borderColor = '#555'; });
            } else {
                body.style.backgroundColor = '#f5f5f5';
                body.style.color = '#333';
                sections.forEach(s => { s.style.borderColor = '#ccc'; s.style.backgroundColor = '#fff'; });
                buttons.forEach(b => { b.style.backgroundColor = '#fff'; b.style.color = '#333'; b.style.borderColor = '#999'; });
            }
        }
    </script>
</body>
</html>
