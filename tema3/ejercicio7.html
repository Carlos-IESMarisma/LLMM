<!DOCTYPE html>
<html>
<head>
    <title>Exercise 7 - Image Slider</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        .slider {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .slide.active { opacity: 1; }
        .overlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .overlay h2 { font-size: 2rem; }
        .overlay p { font-size: 1rem; opacity: 0.85; }
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.25);
            border: 2px solid white;
            color: white;
            font-size: 2rem;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            z-index: 10;
        }
        .btn:hover { background: rgba(255,255,255,0.5); }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }
        .dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            border: 2px solid white;
            transition: background 0.2s;
        }
        .dot.active { background: white; }
    </style>
</head>
<body>
    <div class="slider" id="slider"></div>
    <button class="btn" id="prevBtn" onclick="changeSlide(-1)">&#10094;</button>
    <button class="btn" id="nextBtn" onclick="changeSlide(1)">&#10095;</button>
    <div class="dots" id="dots"></div>

    <script>
        const slides = [
            {
                url: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400",
                title: "Mountains",
                desc: "Breathtaking alpine scenery"
            },
            {
                url: "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1400",
                title: "Forest Path",
                desc: "A walk through nature"
            },
            {
                url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1400",
                title: "Tropical Beach",
                desc: "Crystal clear waters"
            },
            {
                url: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=1400",
                title: "Desert Dunes",
                desc: "The endless sands"
            },
            {
                url: "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1400",
                title: "Valley",
                desc: "Hidden in the mist"
            }
        ];

        let current = 0;
        const sliderEl = document.getElementById('slider');
        const dotsEl = document.getElementById('dots');

        // Build slides
        slides.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'slide' + (i === 0 ? ' active' : '');
            div.style.backgroundImage = `url('${s.url}')`;
            div.innerHTML = `<div class="overlay"><h2>${s.title}</h2><p>${s.desc}</p></div>`;
            sliderEl.appendChild(div);

            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => goTo(i);
            dotsEl.appendChild(dot);
        });

        function goTo(n) {
            document.querySelectorAll('.slide')[current].classList.remove('active');
            document.querySelectorAll('.dot')[current].classList.remove('active');
            current = (n + slides.length) % slides.length;
            document.querySelectorAll('.slide')[current].classList.add('active');
            document.querySelectorAll('.dot')[current].classList.add('active');
        }

        function changeSlide(dir) { goTo(current + dir); }

        // Auto-advance
        setInterval(() => changeSlide(1), 4000);
    </script>
</body>
</html>
